services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: pi-bully-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bully}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: >
      -path /migrations
      -database postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bully}?sslmode=disable
      up
    restart: "no"

  localstack:
    image: localstack/localstack:latest
    container_name: pi-bully-storage
    ports:
      - "9000:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - localstack-data:/var/lib/localstack

  createbuckets:
    image: amazon/aws-cli
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://localstack:4566 s3 mb s3://${STORAGE_BUCKET:-bully} || true;
      echo 'Bucket created';
      "
    restart: "no"

  node1:
    build: .
    image: pi-bully-node
    env_file: .env
    environment:
      NODE_ID: 1
      NODE_ADDRESS: node1:50051
      GRPC_PORT: 50051
      HEALTH_PORT: 8080
      POSTGRES_HOST: postgres
      MEMBERLIST_BIND_ADDR: 0.0.0.0
      MEMBERLIST_ADVERTISE_ADDR: node1
      MEMBERLIST_BIND_PORT: 7946
      MEMBERLIST_SEEDS: node1:7946,node2:7946,node3:7946
      STORAGE_ENDPOINT: localstack:4566
      LOG_FORMAT: json
    ports:
      - "8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  node2:
    image: pi-bully-node
    env_file: .env
    environment:
      NODE_ID: 2
      NODE_ADDRESS: node2:50051
      GRPC_PORT: 50051
      HEALTH_PORT: 8080
      POSTGRES_HOST: postgres
      MEMBERLIST_BIND_ADDR: 0.0.0.0
      MEMBERLIST_ADVERTISE_ADDR: node2
      MEMBERLIST_BIND_PORT: 7946
      MEMBERLIST_SEEDS: node1:7946,node2:7946,node3:7946
      STORAGE_ENDPOINT: localstack:4566
      LOG_FORMAT: json
    ports:
      - "8082:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  node3:
    image: pi-bully-node
    env_file: .env
    environment:
      NODE_ID: 3
      NODE_ADDRESS: node3:50051
      GRPC_PORT: 50051
      HEALTH_PORT: 8080
      POSTGRES_HOST: postgres
      MEMBERLIST_BIND_ADDR: 0.0.0.0
      MEMBERLIST_ADVERTISE_ADDR: node3
      MEMBERLIST_BIND_PORT: 7946
      MEMBERLIST_SEEDS: node1:7946,node2:7946,node3:7946
      STORAGE_ENDPOINT: localstack:4566
      LOG_FORMAT: json
    ports:
      - "8083:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  localstack-data:
